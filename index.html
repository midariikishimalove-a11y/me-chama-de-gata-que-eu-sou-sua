<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>me chama de gata que eu sou sua</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400;1,500&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #f2ede3;
    --ink: #1d1a17;
    --night: #07071a;
    --gold: #f6c56b;
    --cream: #f6ecdc;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; background: var(--night); }
  body { font-family: "Cormorant Garamond", Georgia, serif; color: var(--cream); }
  .sans { font-family: "Helvetica Neue", Arial, sans-serif; text-transform: uppercase; letter-spacing: .1em; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }

  /* céu */
  #sky { position: fixed; inset: 0; width: 100%; height: 100%;
    background: radial-gradient(ellipse at 50% 28%, #1e1b46 0%, #0e0d27 50%, #07071a 100%); }

  /* capa */
  #cover { position: fixed; inset: 0; z-index: 10; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    background-color: var(--paper);
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='320' height='320'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .32  0 0 0 0 .27  0 0 0 0 .2  0 0 0 .09 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
    transition: opacity 2.8s ease, visibility 0s linear 2.8s; }
  #cover.gone { opacity: 0; visibility: hidden; pointer-events: none; }
  #tiger { height: min(86vh, 880px); width: auto; transition: transform .6s ease; }
  #cover:hover #tiger { transform: rotate(-1deg) scale(1.01); }
  #cover .title { position: absolute; top: 30px; right: 38px; font-size: 12px; color: var(--ink); }
  #cover .open { position: absolute; bottom: 34px; right: 38px; font-size: 12px; color: var(--ink);
    padding: 11px 24px; border: 1px solid var(--ink); border-radius: 999px; transition: background .3s, color .3s; }
  #cover .open:hover { background: var(--ink); color: var(--paper); }

  /* legenda dos dias */
  #daycap { position: fixed; top: 6vh; left: 0; right: 0; text-align: center; font-size: 12px;
    color: var(--gold); opacity: 0; transition: opacity 2s ease; pointer-events: none; }
  #daycap small { display: block; margin-top: 8px; font-size: 10px; color: rgba(246,236,220,.55); }
  #daycap.on { opacity: 1; }

  /* carta */
  #letter { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
    width: min(660px, 56vw); font-style: italic; font-size: clamp(19px, 1.45vw, 25px); line-height: 1.6;
    text-shadow: 0 0 14px rgba(7,7,26,.95), 0 0 3px rgba(7,7,26,.9); transition: opacity 1.6s ease; }
  #letter p + p { margin-top: .9em; }
  #letter span { opacity: 0; filter: blur(6px); transition: opacity 1.6s ease, filter 1.6s ease; }
  #letter span.on { opacity: 1; filter: blur(0); }
  #letter.gone { opacity: 0; pointer-events: none; }

  #next { position: fixed; bottom: 6vh; left: 50%; transform: translateX(-50%); font-size: 12px;
    color: var(--gold); padding: 10px 22px; border: 1px solid rgba(246,197,107,.5); border-radius: 999px;
    opacity: 0; pointer-events: none; transition: opacity 1.5s ease, background .3s; }
  #next.on { opacity: 1; pointer-events: auto; }
  #next:hover { background: rgba(246,197,107,.12); }

  /* flor */
  #flower { position: fixed; bottom: 0; right: 5vw; height: 52vh; width: auto; pointer-events: none; }

  /* pergunta */
  #ask { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 44px; opacity: 0; pointer-events: none; transition: opacity 1.8s ease; }
  #ask.on { opacity: 1; pointer-events: auto; }
  #ask h1 { font-weight: 400; font-style: italic; font-size: clamp(44px, 5.4vw, 84px); line-height: 1.1; text-align: center;
    text-shadow: 0 0 24px rgba(7,7,26,.9); transition: opacity .8s ease; }
  #ask .row { display: flex; gap: 34px; align-items: center; }
  #yes, #no { font-style: italic; font-size: 26px; padding: 12px 38px; border-radius: 999px;
    transition: transform .35s cubic-bezier(.3,1.6,.5,1), left .35s ease, top .35s ease, opacity .5s; }
  #yes { background: var(--gold); color: #1a1206; box-shadow: 0 0 30px rgba(246,197,107,.35); }
  #yes:hover { box-shadow: 0 0 44px rgba(246,197,107,.6); }
  #no { border: 1px solid rgba(246,236,220,.45); color: var(--cream); white-space: nowrap; }
  #no.loose { position: fixed; z-index: 5; }
  #quip { min-height: 22px; font-size: 13px; color: var(--gold); }

  /* corações */
  .heart { position: fixed; top: -8vh; pointer-events: none; z-index: 20; animation: fall linear forwards; }
  @keyframes fall {
    to { transform: translateY(118vh) rotate(var(--rot)); }
  }

  /* música */
  #music { position: fixed; bottom: 22px; left: 26px; font-size: 11px; color: rgba(246,236,220,.6);
    opacity: 0; pointer-events: none; transition: opacity 1.5s ease, color .3s; }
  #music.on { opacity: 1; pointer-events: auto; }
  #music:hover { color: var(--cream); }
  #yt { position: fixed; left: -10000px; top: 0; width: 200px; height: 200px; }
</style>
</head>
<body>

<canvas id="sky"></canvas>
<canvas id="flower" width="600" height="920"></canvas>

<div id="daycap" class="sans"></div>
<div id="letter"></div>
<button id="next" class="sans">continuar →</button>

<section id="ask">
  <h1>quer namorar comigo?</h1>
  <div class="row">
    <button id="yes">sim</button>
    <button id="no">não</button>
  </div>
  <div id="quip" class="sans"></div>
</section>

<button id="music" class="sans">♪ pausar música</button>
<div id="yt"><div id="ytplayer"></div></div>

<div id="cover">
  <canvas id="tiger" width="1200" height="1440"></canvas>
  <div class="title sans">me chama de gata que eu sou sua</div>
  <div class="open sans">clique aqui</div>
</div>

<script>
  // ---------- ajustes ----------
  const VIDEO_ID = 'X45D-93PciE';
  const START = new Date(2026, 9, 21); // 21/10/2026, o dia 1 do céu
  const LETTER = [
    'oi amor, queria dizer como você é incrível, e como amo passar tempo contigo, escutar sobre seus gostos e tudo o que você tem a dizer, desde fofocas ou pensamentos bobos, poder receber uma notificação sua é mágico e muda meu dia, poder escutar sua voz é como mágica, eu fico hipnotizada, é algo que muito me encanta',
    'poder estar do seu lado é a melhor coisa do mundo, adoro ler suas mensagens carinhosas, elas me fazem tirar forças pra eu conseguir me cuidar muito melhor, e me fazem ainda ter esperança de conseguir melhorar de tudo que tô passando aqui, e tenho sorte de ter você como a minha mulher',
    'eu amo muito você e amo mais ainda ficar e escutar você',
  ];
  const QUIPS = [
    'tem certeza? 🥺', 'acho que você errou o botão', 'esse botão tá com defeito',
    'tenta de novo, gata', 'o não ficou com vergonha e fugiu', 'nem o botão concorda com você',
    'tá ficando difícil, hein', 'última chance de clicar no certo',
  ];

  // ---------- utilidades ----------
  function rng(seed) { return () => { seed = (seed * 1664525 + 1013904223) >>> 0; return seed / 4294967296; }; }
  const wait = ms => new Promise(r => setTimeout(r, ms));
  const $ = id => document.getElementById(id);

  // dias juntas (?dias=N força um valor, pra testar)
  const days = (() => {
    const forced = parseInt(new URLSearchParams(location.search).get('dias'), 10);
    if (forced > 0) return forced;
    const today = new Date(); today.setHours(0, 0, 0, 0);
    return Math.max(1, Math.round((today - START) / 86400000) + 1);
  })();

  // pincelada com relevo de tinta e marcas de cerda
  function brush(g, R, x, y, ang, len, w, col) {
    const dx = Math.cos(ang) * len, dy = Math.sin(ang) * len;
    const nx = -Math.sin(ang), ny = Math.cos(ang), bend = (R() - .5) * len * .5;
    const mx = x + dx / 2 + nx * bend, my = y + dy / 2 + ny * bend;
    const path = (ox, oy) => { g.beginPath(); g.moveTo(x + ox, y + oy); g.quadraticCurveTo(mx + ox, my + oy, x + dx + ox, y + dy + oy); };
    g.lineCap = 'round';
    g.lineWidth = w; g.strokeStyle = 'rgba(60,30,10,.15)'; path(1.6, 1.9); g.stroke();
    g.strokeStyle = col; path(0, 0); g.stroke();
    const n = 2 + Math.floor(w / 4);
    for (let i = 0; i < n; i++) {
      const o = (i / (n - 1) - .5) * w * .75;
      g.lineWidth = .7 + R() * 1.1;
      g.strokeStyle = R() < .55 ? 'rgba(255,255,255,.2)' : 'rgba(0,0,0,.09)';
      path(nx * o, ny * o); g.stroke();
    }
  }

  // traço gestual afinando na ponta (listras, contornos)
  function gesture(g, R, pts, w, col, jit) {
    g.lineCap = 'round'; g.lineJoin = 'round';
    const P = pts.map(([x, y]) => [x + (R() - .5) * jit, y + (R() - .5) * jit]);
    const segs = 14;
    const at = t => {
      const f = t * (P.length - 1), i = Math.min(P.length - 2, Math.floor(f)), u = f - i;
      return [P[i][0] + (P[i + 1][0] - P[i][0]) * u, P[i][1] + (P[i + 1][1] - P[i][1]) * u];
    };
    for (let pass = 0; pass < 3; pass++) {
      for (let s = 0; s < segs; s++) {
        const t0 = s / segs, t1 = (s + 1) / segs;
        const a = at(t0), b = at(t1), wob = (R() - .5) * 2;
        const taper = (.5 + .5 * Math.sin(Math.PI * (.1 + .8 * t0))) * (.75 + R() * .5);
        g.beginPath(); g.moveTo(a[0] + wob, a[1] + wob); g.lineTo(b[0], b[1]);
        if (pass === 0) { g.lineWidth = w * taper + 3; g.strokeStyle = 'rgba(95,115,145,.45)'; }
        else if (pass === 1) { g.lineWidth = w * taper; g.strokeStyle = col; }
        else { g.lineWidth = 1; g.strokeStyle = 'rgba(255,255,255,.18)'; }
        g.stroke();
      }
    }
  }

  // ---------- tigre pintado ----------
  function paintTiger(cv) {
    const g = cv.getContext('2d'), R = rng(7);
    g.scale(cv.width / 600, cv.height / 720);
    const j = a => (R() - .5) * a;

    const outline = [[178,92],[206,142],[250,128],[300,121],[350,128],[394,142],[422,92],[450,152],[460,206],
      [494,262],[480,300],[504,336],[470,372],[480,420],[508,520],[528,640],[544,716],
      [56,716],[72,640],[92,520],[120,420],[130,372],[96,336],[120,300],[106,262],[140,206],[150,152]];
    const sil = new Path2D();
    outline.forEach(([x, y], i) => { const px = x + j(9), py = y + j(9); i ? sil.lineTo(px, py) : sil.moveTo(px, py); });
    sil.closePath();

    // sombra de papel recortado
    g.save();
    g.shadowColor = 'rgba(40,25,10,.28)'; g.shadowBlur = 22; g.shadowOffsetX = 7; g.shadowOffsetY = 10;
    g.fillStyle = '#ea7a20'; g.fill(sil);
    g.restore();

    g.save();
    g.clip(sil);

    const inE = (x, y, cx, cy, rx, ry) => ((x - cx) / rx) ** 2 + ((y - cy) / ry) ** 2 < 1;
    const white = (x, y) => {
      const n = j(.4);
      return inE(x, y, 246, 252, 54, 28 + n * 22) || inE(x, y, 354, 252, 54, 28 + n * 22) ||
        inE(x, y, 300, 404, 86, 60) || inE(x, y, 182, 340, 56, 42) || inE(x, y, 418, 340, 56, 42) ||
        inE(x, y, 300, 596, 124 + n * 30, 156) || inE(x, y, 190, 152, 18, 32) || inE(x, y, 410, 152, 18, 32);
    };
    const oranges = ['#e86f1c','#ef8524','#f39a2c','#f5b13b','#f8c652','#d95d16','#fbd56a','#e2641a','#f7a83a'];
    const whites = ['#f6f2ea','#efe9df','#fbf8f2','#e3e0da','#c9d1dc','#aebdd0','#f3d8a8','#ffffff'];

    for (let k = 0; k < 7000; k++) {
      const x = 50 + R() * 500, y = 80 + R() * 640;
      if (!g.isPointInPath(sil, x * cv.width / 600, y * cv.height / 720)) continue;
      const pal = white(x, y) ? whites : oranges;
      const ang = Math.atan2(y - 380, x - 300) + j(1.2) + (y > 470 ? .9 : 0);
      brush(g, R, x, y, ang, 12 + R() * 26, 6 + R() * 9, pal[Math.floor(R() * pal.length)]);
    }

    // listras: cada lado com o próprio tremor, como pintado à mão
    const S = [
      [[[300,146],[298,180],[301,214]], 15], [[[279,154],[282,186],[289,216]], 11], [[[257,168],[266,198],[274,226]], 10],
      [[[226,196],[246,212],[264,226]], 8], [[[318,210],[312,236]], 6],
      [[[146,288],[182,292],[222,306]], 13], [[[134,318],[176,328],[216,344]], 14], [[[146,354],[184,360],[222,374]], 12],
      [[[158,392],[190,396],[216,404]], 9], [[[224,298],[214,318],[204,336]], 7], [[[110,262],[140,270],[168,268]], 10],
      [[[232,452],[252,462],[270,478]], 10], [[[198,430],[216,450],[236,472]], 9],
      [[[126,466],[166,488],[208,522]], 17], [[[104,536],[150,566],[198,600]], 19], [[[96,612],[140,646],[190,682]], 18],
      [[[176,444],[196,474],[214,508]], 11], [[[90,690],[130,704]], 14], [[[160,560],[176,600],[184,640]], 9],
      [[[176,104],[188,126],[202,150]], 10], [[[150,160],[146,190]], 8],
    ];
    for (const [pts, w] of S) {
      gesture(g, R, pts, w, '#17110c', 10);
      gesture(g, R, pts.map(([x, y]) => [600 - x, y]).reverse(), w, '#17110c', 10);
    }
    g.restore();

    // olhos, nariz e boca
    function eye(cx, f) {
      g.beginPath();
      g.moveTo(cx - 32 * f, 284); g.quadraticCurveTo(cx, 258, cx + 30 * f, 274); g.quadraticCurveTo(cx + 4 * f, 300, cx - 32 * f, 284);
      g.fillStyle = '#e4b03a'; g.fill();
      g.beginPath(); g.ellipse(cx - 6 * f, 274, 10, 4, 0, 0, Math.PI * 2); g.fillStyle = 'rgba(255,240,180,.5)'; g.fill();
      g.beginPath();
      g.moveTo(cx - 32 * f, 284); g.quadraticCurveTo(cx, 258, cx + 30 * f, 274); g.quadraticCurveTo(cx + 4 * f, 300, cx - 32 * f, 284);
      g.lineWidth = 6; g.strokeStyle = '#17110c'; g.stroke();
      g.beginPath(); g.ellipse(cx + 2 * f, 280, 6, 10, 0, 0, Math.PI * 2); g.fillStyle = '#17110c'; g.fill();
      g.beginPath(); g.arc(cx + 5 * f, 275, 2.6, 0, Math.PI * 2); g.fillStyle = '#fff8e8'; g.fill();
    }
    eye(254, 1); eye(346, -1);
    g.beginPath(); g.moveTo(270, 350); g.quadraticCurveTo(300, 343, 330, 350); g.lineTo(300, 385); g.closePath();
    g.fillStyle = '#e88a7c'; g.fill(); g.lineWidth = 4; g.strokeStyle = '#2a1610'; g.stroke();
    gesture(g, R, [[300,385],[300,404]], 5, '#17110c', 1);
    gesture(g, R, [[300,404],[284,418],[262,414]], 5, '#17110c', 2);
    gesture(g, R, [[300,404],[316,418],[338,414]], 5, '#17110c', 2);
    g.lineWidth = 1.6; g.strokeStyle = 'rgba(30,25,20,.55)'; g.lineCap = 'round';
    for (let k = 0; k < 3; k++) {
      g.beginPath(); g.moveTo(248, 398 + k * 10); g.quadraticCurveTo(196, 392 + k * 14, 150, 404 + k * 22); g.stroke();
      g.beginPath(); g.moveTo(352, 398 + k * 10); g.quadraticCurveTo(404, 392 + k * 14, 450, 404 + k * 22); g.stroke();
    }
  }
  paintTiger($('tiger'));

  // ---------- céu ----------
  const sky = $('sky'), sg = sky.getContext('2d');
  let SW = 0, SH = 0;
  function resize() {
    const dpr = Math.min(2, devicePixelRatio || 1);
    SW = innerWidth; SH = innerHeight;
    sky.width = SW * dpr; sky.height = SH * dpr;
    sg.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  addEventListener('resize', resize); resize();

  const R0 = rng(42);
  const dust = Array.from({ length: 460 }, () => ({
    x: R0(), y: R0(), r: R0() < .9 ? .35 + R0() * .8 : 1.1 + R0() * .6, a: .2 + R0() * .6, ph: R0() * 6.3, sp: .4 + R0() * 1.4,
  }));

  // as estrelas dela: posições fixas, então o céu de ontem continua igual hoje (só cresce)
  const RG = rng(2110);
  const ours = [];
  for (let i = 0; i < days; i++) {
    let p;
    if (i === 0) p = { x: .19, y: .23 };
    else do { p = { x: .04 + RG() * .92, y: .05 + RG() * .9 }; } while ((p.x > .26 && p.x < .74 && p.y > .1 && p.y < .9) || (p.x > .34 && p.x < .66 && p.y <= .1));
    ours.push({ ...p, r: i === 0 ? 2.6 : 1.5 + RG() * 1.1, ph: RG() * 6.3 });
  }
  const step = Math.min(700, 7000 / days);
  const firstStarAt = 2400;
  const lastStarAt = firstStarAt + (days - 1) * step;

  let skyStart = null, meteor = null, nextMeteor = 9000;
  function drawSky(now) {
    sg.clearRect(0, 0, SW, SH);
    const t = skyStart === null ? 0 : now - skyStart;
    const fade = Math.min(1, t / 3000);

    for (const s of dust) {
      const tw = .65 + .35 * Math.sin(now / 1000 * s.sp + s.ph);
      sg.fillStyle = `rgba(255,255,255,${s.a * tw * fade})`;
      sg.beginPath(); sg.arc(s.x * SW, s.y * SH, s.r, 0, 6.3); sg.fill();
    }

    ours.forEach((s, i) => {
      const local = t - (firstStarAt + i * step);
      if (local < 0) return;
      const a = Math.min(1, local / 1400), tw = .82 + .18 * Math.sin(now / 650 + s.ph);
      const x = s.x * SW, y = s.y * SH, glow = s.r * 10;
      const grd = sg.createRadialGradient(x, y, 0, x, y, glow);
      grd.addColorStop(0, `rgba(255,214,130,${.5 * a * tw})`);
      grd.addColorStop(1, 'rgba(255,214,130,0)');
      sg.fillStyle = grd; sg.beginPath(); sg.arc(x, y, glow, 0, 6.3); sg.fill();
      const L = s.r * 5.5 * tw;
      sg.strokeStyle = `rgba(255,236,190,${.75 * a * tw})`; sg.lineWidth = 1;
      sg.beginPath(); sg.moveTo(x - L, y); sg.lineTo(x + L, y); sg.moveTo(x, y - L); sg.lineTo(x, y + L); sg.stroke();
      sg.fillStyle = `rgba(255,246,222,${a})`; sg.beginPath(); sg.arc(x, y, s.r, 0, 6.3); sg.fill();
    });

    // estrela cadente de vez em quando
    if (skyStart !== null && t > nextMeteor && !meteor) {
      meteor = { x: SW * (.3 + Math.random() * .7), y: SH * Math.random() * .35, born: now };
      nextMeteor = t + 9000 + Math.random() * 9000;
    }
    if (meteor) {
      const u = (now - meteor.born) / 1000;
      if (u > 1) meteor = null;
      else {
        const hx = meteor.x - u * 260, hy = meteor.y + u * 130, a = Math.sin(Math.PI * u);
        const grd = sg.createLinearGradient(hx, hy, hx + 120, hy - 60);
        grd.addColorStop(0, `rgba(255,250,235,${.9 * a})`); grd.addColorStop(1, 'rgba(255,250,235,0)');
        sg.strokeStyle = grd; sg.lineWidth = 1.4;
        sg.beginPath(); sg.moveTo(hx, hy); sg.lineTo(hx + 120, hy - 60); sg.stroke();
      }
    }
    requestAnimationFrame(drawSky);
  }
  requestAnimationFrame(drawSky);

  // ---------- flor que cresce ----------
  const fl = $('flower'), fg = fl.getContext('2d');
  fg.scale(2, 2);
  const flowerStrokes = (() => {
    const R = rng(1021), out = [];
    const stem = t => [150 + Math.sin(t * 3.2) * 16 - t * 6, 455 - t * 300];
    const greens = ['#4f8a3c','#6aa84f','#3c6e2f','#88b85c','#5c9944'];
    for (let k = 0; k < 220; k++) {
      const t = R(), [x, y] = stem(t), [x2, y2] = stem(Math.min(1, t + .02));
      out.push({ at: t * 1800, x: x + (R() - .5) * 6, y, ang: Math.atan2(y2 - y, x2 - x), len: 10 + R() * 10, w: 4 + R() * 3, col: greens[Math.floor(R() * 5)] });
    }
    const leaf = (t, side, at) => {
      const [bx, by] = stem(t), ang = -Math.PI / 2 + side * 1.0, L = 70;
      for (let k = 0; k < 90; k++) {
        const u = R(), v = (R() - .5) * 2 * Math.sin(Math.PI * u) * 16;
        const x = bx + Math.cos(ang) * L * u - Math.sin(ang) * v, y = by + Math.sin(ang) * L * u + Math.cos(ang) * v;
        out.push({ at: at + u * 700, x, y, ang: ang + (R() - .5) * .5, len: 8 + R() * 10, w: 4 + R() * 4, col: greens[Math.floor(R() * 5)] });
      }
    };
    leaf(.3, -1, 1100); leaf(.52, 1, 1500);
    const [cx, cy] = stem(1);
    const pinks = ['#f27a9b','#f59ab0','#e85d84','#f9c0cf','#ef8f6b','#fbe3e8','#f06e8f'];
    for (let p = 0; p < 6; p++) {
      const pa = p / 6 * Math.PI * 2 + .3;
      for (let k = 0; k < 120; k++) {
        const u = Math.sqrt(R()), v = (R() - .5) * 2 * Math.sin(Math.PI * u) * 24;
        const d = 12 + u * 56;
        const x = cx + Math.cos(pa) * d - Math.sin(pa) * v, y = cy + Math.sin(pa) * d + Math.cos(pa) * v;
        out.push({ at: 2400 + u * 1800 + p * 60, x, y, ang: pa + (R() - .5) * .8, len: 8 + R() * 12, w: 5 + R() * 5, col: pinks[Math.floor(R() * pinks.length)] });
      }
    }
    const yellows = ['#f6c14a','#e89a2a','#f8d36a','#b9741e'];
    for (let k = 0; k < 70; k++) {
      const a = R() * 6.3, r = Math.sqrt(R()) * 16;
      out.push({ at: 4200 + R() * 600, x: cx + Math.cos(a) * r, y: cy + Math.sin(a) * r, ang: R() * 6.3, len: 4 + R() * 6, w: 4 + R() * 3, col: yellows[Math.floor(R() * 4)] });
    }
    out.sort((a, b) => a.at - b.at);
    return { list: out };
  })();

  function growFlower() {
    const R = rng(77), t0 = performance.now();
    let i = 0;
    const list = flowerStrokes.list;
    return new Promise(done => {
      (function frame(now) {
        const t = now - t0;
        while (i < list.length && list[i].at <= t) {
          const s = list[i++];
          brush(fg, R, s.x, s.y, s.ang, s.len, s.w, s.col);
        }
        if (i < list.length) return requestAnimationFrame(frame);
        done();
      })(t0);
    });
  }

  // ---------- música ----------
  let player = null, ytReady = false, wantMusic = false;
  const musicBtn = $('music');
  window.onYouTubeIframeAPIReady = () => {
    player = new YT.Player('ytplayer', {
      videoId: VIDEO_ID, width: 200, height: 200,
      playerVars: { playsinline: 1, controls: 0, rel: 0, disablekb: 1 },
      events: {
        onReady: () => { ytReady = true; if (wantMusic) startMusic(); },
        onStateChange: e => {
          if (e.data === YT.PlayerState.ENDED) { player.seekTo(0); player.playVideo(); }
          musicBtn.textContent = e.data === YT.PlayerState.PLAYING ? '♪ pausar música' : '♪ tocar música';
        },
        onError: () => { musicBtn.hidden = true; },
      },
    });
  };
  const yt = document.createElement('script');
  yt.src = 'https://www.youtube.com/iframe_api';
  document.head.appendChild(yt);

  function startMusic() {
    wantMusic = true;
    if (!ytReady) return;
    player.setVolume(0); player.playVideo();
    let v = 0;
    const ramp = setInterval(() => { v += 4; player.setVolume(Math.min(85, v)); if (v >= 85) clearInterval(ramp); }, 200);
  }
  musicBtn.addEventListener('click', () => {
    if (!player) return;
    player.getPlayerState() === YT.PlayerState.PLAYING ? player.pauseVideo() : player.playVideo();
  });

  // ---------- carta ----------
  const letterEl = $('letter');
  const phrases = [];
  for (const para of LETTER) {
    const p = document.createElement('p');
    para.split(/(?<=,)\s+/).forEach((txt, k) => {
      const s = document.createElement('span');
      s.textContent = (k ? ' ' : '') + txt;
      p.appendChild(s); phrases.push(s);
    });
    letterEl.appendChild(p);
  }

  // ---------- a sequência ----------
  let opened = false;
  $('cover').addEventListener('click', async () => {
    if (opened) return;
    opened = true;
    startMusic();
    $('cover').classList.add('gone');
    skyStart = performance.now();
    musicBtn.classList.add('on');

    await wait(lastStarAt + 1600);
    $('daycap').innerHTML = `dia ${days} do nosso céu<small>uma estrela pra cada dia</small>`;
    $('daycap').classList.add('on');

    await wait(2200);
    for (const s of phrases) {
      s.classList.add('on');
      await wait(900 + s.textContent.length * 48);
    }

    await wait(1200);
    growFlower();
    await wait(4000);
    $('next').classList.add('on');
  });

  $('next').addEventListener('click', async () => {
    $('next').classList.remove('on');
    letterEl.classList.add('gone');
    await wait(1400);
    $('ask').classList.add('on');
  });

  // ---------- sim / não ----------
  const yes = $('yes'), no = $('no'), quip = $('quip');
  let tries = 0, gaveUp = false, answered = false;

  function flee() {
    if (gaveUp || answered) return;
    tries++;
    const r = no.getBoundingClientRect();
    if (!no.classList.contains('loose')) {
      no.style.left = r.left + 'px'; no.style.top = r.top + 'px';
      no.classList.add('loose');
      no.getBoundingClientRect();
    }
    const m = 40, mx = lastMouse[0], my = lastMouse[1];
    let x, y, guard = 0;
    do {
      x = m + Math.random() * (innerWidth - r.width - 2 * m);
      y = m + Math.random() * (innerHeight - r.height - 2 * m);
    } while (Math.hypot(x + r.width / 2 - mx, y + r.height / 2 - my) < 300 && ++guard < 40);
    no.style.left = x + 'px'; no.style.top = y + 'px';
    no.style.transform = `scale(${Math.max(.45, 1 - tries * .07)}) rotate(${(Math.random() - .5) * 30}deg)`;
    yes.style.transform = `scale(${Math.min(1.9, 1 + tries * .1)})`;
    quip.textContent = QUIPS[(tries - 1) % QUIPS.length];

    if (tries >= 10) {
      gaveUp = true;
      no.textContent = 'sim';
      no.style.transform = 'scale(1)';
      quip.textContent = 'ok, o não desistiu de fugir';
    }
  }

  let lastMouse = [innerWidth / 2, innerHeight / 2];
  addEventListener('mousemove', e => {
    lastMouse = [e.clientX, e.clientY];
    if (!$('ask').classList.contains('on') || gaveUp || answered) return;
    const r = no.getBoundingClientRect();
    if (Math.hypot(e.clientX - (r.left + r.width / 2), e.clientY - (r.top + r.height / 2)) < r.width / 2 + 70) flee();
  });
  no.addEventListener('click', e => { if (gaveUp) accept(); else { e.preventDefault(); flee(); } });
  yes.addEventListener('click', accept);

  function accept() {
    if (answered) return;
    answered = true;
    const h1 = $('ask').querySelector('h1');
    h1.style.opacity = 0;
    yes.style.opacity = 0; no.style.opacity = 0; quip.textContent = '';
    setTimeout(() => {
      h1.textContent = 'eu sabia!!! 💖';
      h1.style.opacity = 1;
      yes.remove(); no.remove();
    }, 800);
    const hearts = ['💖', '💗', '💕', '❤️', '🧡', '💛', '🐯'];
    for (let k = 0; k < 150; k++) {
      const h = document.createElement('span');
      h.className = 'heart';
      h.textContent = hearts[Math.floor(Math.random() * hearts.length)];
      h.style.left = Math.random() * 100 + 'vw';
      h.style.fontSize = 16 + Math.random() * 26 + 'px';
      h.style.setProperty('--rot', (Math.random() - .5) * 720 + 'deg');
      h.style.animationDuration = 4 + Math.random() * 5 + 's';
      h.style.animationDelay = Math.random() * 4 + 's';
      document.body.appendChild(h);
      h.addEventListener('animationend', () => h.remove());
    }
  }
</script>
</body>
</html>
